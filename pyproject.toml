[project]
name = "activation-steering-study"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "transformers",
    "typesafe-sdk>=0.7.1",
]

[dependency-groups]
dev = [
    "mutmut>=3.8.0",
    "mypy>=2.3.1",
    "pytest",
    "scipy-stubs>=1.18.1.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["uv_build==0.11.25"]
build-backend = "uv_build"

[tool.mypy]
check_untyped_defs = true
warn_unused_ignores = true

[tool.mutmut]
only_mutate = ["src/activation_steering_study/analysis/bootstrap.py"]
pytest_add_cli_args_test_selection = ["src/activation_steering_study/analysis/test_bootstrap.py"]
