[project]
name = "activation-steering-study"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "torch",
    "transformers",
]

[dependency-groups]
dev = [
    "pytest",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
